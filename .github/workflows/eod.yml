name: EOD Cron

on:
  schedule:
    # 4 offset, redundant attempts instead of one shot at the exact hour — see
    # morning.yml for why. runEod() is idempotency-guarded via
    # daily_state.eod_ran, so extra attempts after the first successful one
    # are free no-ops.
    - cron: '7 3 * * *'
    - cron: '37 3 * * *'
    - cron: '7 4 * * *'
    - cron: '37 4 * * *'
  workflow_dispatch:

jobs:
  eod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run EOD on all servers
        run: |
          jq -r '.[].url' config/users.json | while read url; do
            echo "EOD: $url"
            curl -sf -X POST "$url/cron/eod" \
              -H "x-cron-secret: ${{ secrets.MASTER_CRON_TOKEN }}" \
              -H "Content-Type: application/json" \
              --max-time 30 || echo "⚠ $url failed"
          done