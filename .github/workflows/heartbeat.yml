name: Repo Heartbeat

# GitHub auto-disables scheduled workflows (morning/eod/remind/health/cleanup)
# after 60 days with no repository push activity — running successfully on
# schedule does NOT count as activity, only real commits do. This makes a
# trivial real commit every 50 days so that never happens again, without
# needing anyone to remember to click "Enable workflow".
#
# Checked weekly (cheap) so the 50-day interval is measured in real elapsed
# days rather than approximated with cron's day-of-month field, which resets
# every month and can't express "every N days" reliably across month
# boundaries.

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Commit heartbeat if 50+ days have passed
        run: |
          FILE=.github/HEARTBEAT
          NOW=$(date -u +%s)
          LAST=0
          if [ -f "$FILE" ]; then
            LAST=$(cat "$FILE")
          fi
          DAYS_SINCE=$(( (NOW - LAST) / 86400 ))
          echo "Days since last heartbeat: $DAYS_SINCE"

          if [ "$DAYS_SINCE" -ge 50 ]; then
            echo "$NOW" > "$FILE"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$FILE"
            git commit -m "chore: keepalive heartbeat (keeps scheduled workflows from auto-disabling)"
            git push
            echo "Heartbeat committed."
          else
            echo "Not due yet ($((50 - DAYS_SINCE)) days remaining) — skipping commit."
          fi
