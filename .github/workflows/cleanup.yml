name: Weekly Cleanup

on:
  schedule:
    # Offset off the round hour, plus one backup attempt 30 min later — see
    # morning.yml for why. runCleanup() just deletes rows past a TTL cutoff,
    # so a duplicate run is harmless (nothing left to delete the second time).
    - cron: '11 3 * * 0'
    - cron: '41 3 * * 0'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run cleanup on all servers
        run: |
          jq -r '.[].url' config/users.json | while read url; do
            echo "Cleanup: $url"
            curl -sf -X POST "$url/cron/cleanup" \
              -H "x-cron-secret: ${{ secrets.MASTER_CRON_TOKEN }}" \
              -H "Content-Type: application/json" \
              --max-time 30 || echo "⚠ $url failed"
          done