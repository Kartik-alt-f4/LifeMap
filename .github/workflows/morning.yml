name: Morning Cron

on:
  schedule:
    # 4 offset, redundant attempts instead of one shot at the exact hour —
    # GitHub Actions' scheduler is more congested (and more likely to drop a
    # run) right at round-number minutes, and individual scheduled runs are
    # not guaranteed to fire at all. runMorning() is idempotency-guarded via
    # daily_state.morning_ran, so every attempt after the first successful one
    # is a free no-op — this just raises the odds that at least one lands.
    - cron: '7 11 * * *'
    - cron: '37 11 * * *'
    - cron: '7 12 * * *'
    - cron: '37 12 * * *'
  workflow_dispatch:

jobs:
  morning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run morning on all servers
        run: |
          jq -r '.[].url' config/users.json | while read url; do
            echo "Morning: $url"
            curl -sf -X POST "$url/cron/morning" \
              -H "x-cron-secret: ${{ secrets.MASTER_CRON_TOKEN }}" \
              -H "Content-Type: application/json" \
              --max-time 30 || echo "⚠ $url failed"
          done